server:
  port: 8085
  
  
ms-ai:
    base-url: http://localhost:8089


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
      
      
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,refresh
  metrics:
    export:
      prometheus:
        enabled: true


resilience4j:
  ratelimiter:
    instances:
      ms‑ai:
        limitForPeriod: 3
        limitRefreshPeriod: 5m
        timeoutDuration: 100ms

  circuitbreaker:
    instances:
      ms‑ai‑cb:
        slidingWindowType: COUNT_BASED    
        slidingWindowSize: 10
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 5m

  bulkhead:
    instances:
      ms‑ai‑semaphore:
        maxConcurrentCalls: 2
        maxWaitDuration: 0